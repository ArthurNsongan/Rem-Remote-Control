name: Release

# Build Rem pour Windows, Linux et macOS, puis attache les installeurs
# à une Release GitHub (brouillon, à publier manuellement).
#
# Déclenchement : push d'un tag `v*` (ex. v0.1.0) ou manuellement.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            label: Windows (.msi)
          - platform: ubuntu-24.04
            args: ''
            label: Linux (.deb / .AppImage)
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            label: macOS universel Intel + Apple Silicon (.dmg)

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      # Dépendances système Linux : WebKitGTK (Tauri), appindicator (tray),
      # xdo (enigo), v4l (caméra), xcb/xrandr/dbus (capture écran).
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Install JS deps
        run: pnpm install

      - name: Build + bundle (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des artefacts de mise a jour automatique. Sans ces deux
          # secrets, les bundles sortent mais latest.json n'est pas signe et
          # les clients refusent la mise a jour.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Rem __VERSION__'
          releaseBody: |
            Contrôle ton PC depuis ton téléphone, ta tablette ou un autre ordinateur — sur ton réseau local.

            **Téléchargements**
            - Windows : `.msi`
            - Linux : `.deb` (Debian/Ubuntu) ou `.AppImage` (universel)
            - macOS : `.dmg` (Apple Silicon et Intel)

            À partir de la 0.1.9, Rem se met à jour tout seul : il vérifie les
            nouvelles versions au lancement et propose de les installer.

            > Linux : l'écoute audio nécessite `pulseaudio-utils` (commande `parec`).
            > Mise à jour en place : `.msi` et `.AppImage` uniquement. Avec le `.deb` (géré par apt)
            > et sur macOS (bundle non signé), Rem signale la nouvelle version mais renvoie au téléchargement.
            > macOS : binaire non signé — clic droit → Ouvrir au premier lancement.
          # Genere/complete latest.json, lu par le plugin updater des clients.
          # Chaque job de la matrice y ajoute sa plateforme.
          includeUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
