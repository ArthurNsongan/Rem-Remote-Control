name: Dépendances Linux
description: >
  Installe les bibliothèques système nécessaires à Rem sous Linux :
  Tauri/WebKitGTK, tray, capture d'écran X11 + Wayland (PipeWire/EGL/GBM/DRM),
  caméra V4L2 et entrées (x11rb / wlroots / libei).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        # Tauri (WebView, tray, packaging)
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
        # Chaîne de build (bindgen a besoin de clang)
        sudo apt-get install -y build-essential curl wget file libssl-dev pkg-config clang libclang-dev
        # Caméra V4L2, X11, D-Bus (portail XDG)
        sudo apt-get install -y libv4l-dev libxcb1-dev libxrandr-dev libdbus-1-dev
        # Capture d'écran Wayland : PipeWire + libwayshot (EGL/GBM/DRM/xkbcommon)
        sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libwayland-dev
        sudo apt-get install -y libgbm-dev libegl-dev libdrm-dev libxkbcommon-dev
