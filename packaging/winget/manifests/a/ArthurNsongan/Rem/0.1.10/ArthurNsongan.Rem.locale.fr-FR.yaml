ShortDescription: Contrôle ton PC depuis ton téléphone, ta tablette ou un autre ordinateur.
Description: |-
  Rem transforme ton ordinateur en machine pilotable à distance depuis
  n'importe quel navigateur du réseau local : souris et pavé tactile, clavier
  en temps réel, touches média et volume, partage d'écran où l'on vise au
  doigt, ainsi que la caméra, le micro et l'audio système du PC. L'appairage
  se fait par code PIN et QR code, et rien ne quitte ton réseau local. Ferme
  la fenêtre : Rem continue dans la barre système.
