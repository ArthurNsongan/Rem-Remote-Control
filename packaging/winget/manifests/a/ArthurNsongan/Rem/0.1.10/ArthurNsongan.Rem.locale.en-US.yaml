ShortDescription: Control your PC from your phone, tablet or another computer over your local network.
Description: |-
  Rem turns your computer into a machine you can drive from any browser on the
  same network: mouse and touchpad, real-time keyboard, media and volume keys,
  a touch-to-point screen stream, plus the PC's camera, microphone and system
  audio. Pairing uses a PIN and a QR code, and nothing leaves your local
  network. Close the window and Rem keeps running in the system tray.
