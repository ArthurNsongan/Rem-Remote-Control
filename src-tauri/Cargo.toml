[package]
name = "rem-app"
version = "0.1.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rem_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
enigo = "0.6"
local-ip-address = "0.6"
rand = "0.8"
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }


# --- Dépendances spécifiques à la plateforme ---

[target.'cfg(target_os = "windows")'.dependencies]
# Caméra via Media Foundation, audio via WASAPI (micro + loopback système)
nokhwa = { version = "0.10", features = ["input-msmf"] }
wasapi = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
# Caméra via Video4Linux2 ; l'audio Linux passe par `parec` (PulseAudio/PipeWire),
# donc aucune crate audio nécessaire.
# enigo : X11 (x11rb, Rust pur) + Wayland wlroots + libei (portail XDG, GNOME/KDE).
enigo = { version = "0.6", features = ["wayland", "libei_tokio"] }
nokhwa = { version = "0.10", features = ["input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Caméra via AVFoundation. Pas de capture audio système sur macOS (pilote tiers requis).
nokhwa = { version = "0.10", features = ["input-avfoundation"] }
