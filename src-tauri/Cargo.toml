[package]
name = "rem-app"
version = "0.1.10"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rem_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
enigo = "0.6"
local-ip-address = "0.6"
rand = "0.8"
rust-embed = "8"
mime_guess = "2"
futures-util = "0.3"
xcap = "0.9"
# TLS du serveur LAN. rustls est epingle sur le fournisseur `ring` : le defaut
# aws-lc-rs exige cmake et NASM, que les runners Windows n ont pas.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = "0.14"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tauri-plugin-process = "2"


# --- Dépendances spécifiques à la plateforme ---

[target.'cfg(target_os = "windows")'.dependencies]
# Caméra via Media Foundation, audio via WASAPI (micro + loopback système)
nokhwa = { version = "0.10", features = ["input-msmf"] }
wasapi = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
# Caméra via Video4Linux2 ; l'audio Linux passe par `parec` (PulseAudio/PipeWire),
# donc aucune crate audio nécessaire.
# enigo : X11 (x11rb, Rust pur) + Wayland wlroots + libei (portail XDG, GNOME/KDE).
# Sur le commit epingle plus bas, `libei_tokio` a ete scinde en `libei` + `tokio`.
enigo = { version = "0.6", features = ["wayland", "libei", "tokio"] }
nokhwa = { version = "0.10", features = ["input-v4l"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Caméra via AVFoundation. Pas de capture audio système sur macOS (pilote tiers requis).
nokhwa = { version = "0.10", features = ["input-avfoundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# enigo 0.6.1 fait un unwrap() sur l'ouverture du portail XDG RemoteDesktop
# (linux/libei.rs). Comme le backend libei est essaye en dernier et
# systematiquement - meme quand X11 s'est deja connecte - toute machine sans
# xdg-desktop-portal joignable fait paniquer l'app au demarrage au lieu de
# retomber sur X11. Corrige en amont (open_connection renvoie un Result) mais
# pas encore publie : on epingle le commit. A retirer des la sortie de 0.6.2.
[patch.crates-io]
enigo = { git = "https://github.com/enigo-rs/enigo", rev = "a88d9b7e2cec7043ab5f03e754500a091ea928d1" }
